# ---------------------------------------------------------------------------
# Perfil "h2" - mesmo comportamento do perfil padrao, declarado explicitamente
# para deixar claro na entrega que os dois bancos estao configurados.
# Ativar com: --spring.profiles.active=h2
# Console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:gamificada)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:gamificada
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
