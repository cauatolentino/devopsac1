# ---------------------------------------------------------------------------
# Perfil "postgres" - usado quando a aplicacao sobe via Docker Compose.
# Ativar com: --spring.profiles.active=postgres  (ou SPRING_PROFILES_ACTIVE)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gamificada}
spring.datasource.username=${POSTGRES_USER:grupo12}
spring.datasource.password=${POSTGRES_PASSWORD:grupo12}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# no perfil postgres o console do H2 nao faz sentido
spring.h2.console.enabled=false
