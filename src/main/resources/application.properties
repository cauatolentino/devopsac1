spring.application.name=Grupo12_PraticaATDD

# ---------------------------------------------------------------------------
# Banco H2 em memoria (perfil padrao, usado no desenvolvimento e nos testes)
# Console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:gamificada)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:gamificada
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Swagger / OpenAPI
# UI:   http://localhost:8080/swagger-ui.html
# JSON: http://localhost:8080/v3/api-docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# ---------------------------------------------------------------------------
# B1 / Desafio 3 - servico Python de recomendacao (FastAPI)
# Timeouts curtos: IA lenta ou fora do ar vira resposta degradada, nunca trava o Core.
# ---------------------------------------------------------------------------
ia.recomendacao.url=${IA_RECOMENDACAO_URL:http://localhost:8000}
ia.recomendacao.timeout-conexao-ms=${IA_RECOMENDACAO_TIMEOUT_CONEXAO_MS:500}
ia.recomendacao.timeout-leitura-ms=${IA_RECOMENDACAO_TIMEOUT_LEITURA_MS:1500}

# ---------------------------------------------------------------------------
# B1 / Desafio 4 - eventos assincronos: outbox (banco) -> relay -> RabbitMQ
# O Core sobe e opera sem broker: os eventos esperam no outbox.
# ---------------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2s
# publisher confirms: so marca o evento como publicado depois do ack do broker
spring.rabbitmq.publisher-confirm-type=simple
eventos.relay.habilitado=${EVENTOS_RELAY_HABILITADO:true}
eventos.relay.intervalo-ms=${EVENTOS_RELAY_INTERVALO_MS:2000}

# ---------------------------------------------------------------------------
# B1 / Desafio 5 - IoT: dispositivos publicam MQTT no plugin MQTT do RabbitMQ;
# o Core consome a fila iot.eventos-laboratorio por AMQP.
# ---------------------------------------------------------------------------
spring.rabbitmq.listener.simple.auto-startup=${IOT_CONSUMIDOR_HABILITADO:true}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------------------------------------------------------------------------
# B1 / Desafio 6 - observabilidade
#   /actuator/health/readiness  -> usado pelo Jenkins (health check de HOMOL)
#   /actuator/prometheus        -> coletado pelo Prometheus
# O RabbitMQ fica FORA do health agregado de proposito (ADR-004/ADR-006): broker fora
# nao torna o Core indisponivel - isso e observado pela metrica gamificacao_outbox_pendentes.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false
management.metrics.tags.application=core-gamificacao
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# B1 / Desafio 6 - disjuntor da IA (motivado pela metrica: DNS de container parado = 4-8 s)
ia.recomendacao.disjuntor.falhas-para-abrir=${IA_DISJUNTOR_FALHAS:2}
ia.recomendacao.disjuntor.aberto-ms=${IA_DISJUNTOR_ABERTO_MS:30000}
ia.recomendacao.prazo-total-ms=${IA_PRAZO_TOTAL_MS:2000}
