spring.application.name=Grupo12_PraticaATDD

# ---------------------------------------------------------------------------
# Banco H2 em memoria (perfil padrao, usado no desenvolvimento e nos testes)
# Console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:gamificada)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:gamificada
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Swagger / OpenAPI
# UI:   http://localhost:8080/swagger-ui.html
# JSON: http://localhost:8080/v3/api-docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
