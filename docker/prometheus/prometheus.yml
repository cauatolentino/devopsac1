# B1 / Desafio 6 - coleta de metricas (configuracao versionada)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Core Spring Boot (Actuator + Micrometer)
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  # RabbitMQ (plugin rabbitmq_prometheus, ativado em docker/rabbitmq/enabled_plugins)
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
